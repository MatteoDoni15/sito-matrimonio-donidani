<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Matteo &amp; Anca Daniela — Il nostro matrimonio</title>
<meta name="description" content="Matteo e Anca Daniela si sposano — conferma qui la tua presenza." />
<link rel="icon" type="image/jpeg" href="assets/Stemma_MD.jpeg" />
<link rel="stylesheet" href="assets/fonts-embed.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="leaf-glyph" viewBox="0 0 32 32">
      <path d="M16 3c8.5 5.5 12.5 13 8.8 20.6C22 29 14.6 30.5 11 26.6 5.7 21 6.2 12 16 3z" />
      <path d="M16 7v19" stroke-width="1.3" stroke-linecap="round" fill="none" />
    </symbol>

    <!-- Baroque corner scroll (top-left orientation; mirrored via CSS for the other corners) -->
    <symbol id="citrus-corner" viewBox="0 0 100 100">
      <path d="M6,20 C8,6 30,-4 52,4 C74,12 82,34 70,50 C60,64 40,66 32,54 C26,45 30,34 40,32 C47,30 53,35 50,41"
            fill="none" stroke="var(--ink)" stroke-opacity="0.15" stroke-width="8" stroke-linecap="round" transform="translate(1,1.5)" />
      <path d="M6,20 C8,6 30,-4 52,4 C74,12 82,34 70,50 C60,64 40,66 32,54 C26,45 30,34 40,32 C47,30 53,35 50,41"
            fill="none" stroke="var(--gold)" stroke-width="7" stroke-linecap="round" />
      <path d="M6,20 C8,6 30,-4 52,4 C74,12 82,34 70,50 C60,64 40,66 32,54 C26,45 30,34 40,32 C47,30 53,35 50,41"
            fill="none" stroke="#e8cf94" stroke-width="2.2" stroke-linecap="round" />
      <use href="#leaf-glyph" x="1" y="1" width="20" height="20" fill="var(--gold)" transform="rotate(-35 11 11)" />
      <use href="#leaf-glyph" x="30" y="30" width="15" height="15" fill="#e8cf94" transform="rotate(130 37 37)" />
    </symbol>

    <!-- Cedro (Citrus medica) medallion — sits top-center, straddling the frame -->
    <symbol id="citrus-cedro" viewBox="0 0 150 130">
      <ellipse cx="75" cy="70" rx="58" ry="42" fill="var(--ground-raised)" stroke="var(--gold)" stroke-width="2" />
      <ellipse cx="75" cy="70" rx="51" ry="36" fill="none" stroke="#e8cf94" stroke-width="1.2" />
      <path d="M13,68 C10,62 10,56 15,52" fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linecap="round" />
      <path d="M137,68 C140,62 140,56 135,52" fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linecap="round" />
      <use href="#leaf-glyph" x="66" y="106" width="18" height="18" fill="var(--gold)" transform="rotate(180 75 115)" />
      <g>
        <path d="M75,34 C84,34 92,42 95,55 C98,66 97,80 90,90 C84,98 66,98 60,90 C53,80 52,66 55,55 C58,42 66,34 75,34 Z" fill="#ddb75a" />
        <path d="M64,48 C62,60 62,74 66,86" fill="none" stroke="#b4903f" stroke-width="1.1" opacity="0.55" stroke-linecap="round" />
        <path d="M75,45 C74,58 74,74 75,92" fill="none" stroke="#b4903f" stroke-width="1.1" opacity="0.55" stroke-linecap="round" />
        <path d="M86,48 C88,60 88,74 84,86" fill="none" stroke="#b4903f" stroke-width="1.1" opacity="0.55" stroke-linecap="round" />
        <line x1="75" y1="34" x2="75" y2="26" stroke="#6b5636" stroke-width="2" stroke-linecap="round" />
        <use href="#leaf-glyph" x="61" y="16" width="16" height="16" fill="#7f9468" transform="rotate(-40 69 24)" />
        <use href="#leaf-glyph" x="73" y="16" width="16" height="16" fill="#7f9468" transform="rotate(40 81 24)" />
        <ellipse cx="66" cy="54" rx="7" ry="12" fill="#fff" opacity="0.22" transform="rotate(-20 66 54)" />
      </g>
    </symbol>

    <!-- Pomelo (Citrus maxima) — bottom-left corner -->
    <symbol id="citrus-pomelo" viewBox="0 0 120 120">
      <path d="M6,100 C8,114 30,124 52,116 C74,108 82,86 70,70 C60,56 40,54 32,66 C26,75 30,86 40,88 C47,90 53,85 50,79"
            fill="none" stroke="var(--ink)" stroke-opacity="0.15" stroke-width="7" stroke-linecap="round" transform="translate(1,1.5)" />
      <path d="M6,100 C8,114 30,124 52,116 C74,108 82,86 70,70 C60,56 40,54 32,66 C26,75 30,86 40,88 C47,90 53,85 50,79"
            fill="none" stroke="var(--gold)" stroke-width="6" stroke-linecap="round" />
      <path d="M6,100 C8,114 30,124 52,116 C74,108 82,86 70,70 C60,56 40,54 32,66 C26,75 30,86 40,88 C47,90 53,85 50,79"
            fill="none" stroke="#e8cf94" stroke-width="2" stroke-linecap="round" />
      <use href="#leaf-glyph" x="6" y="88" width="18" height="18" fill="var(--gold)" transform="rotate(150 15 97)" />
      <g>
        <circle cx="57" cy="76" r="22" fill="#ccd08c" />
        <ellipse cx="66" cy="86" rx="14" ry="10" fill="#a7ab68" opacity="0.35" />
        <circle cx="57" cy="76" r="17" fill="none" stroke="#a7ab68" stroke-width="1" opacity="0.4" />
        <use href="#leaf-glyph" x="41" y="46" width="20" height="20" fill="#7f9468" transform="rotate(-25 51 56)" />
        <use href="#leaf-glyph" x="54" y="44" width="18" height="18" fill="#7f9468" transform="rotate(20 63 53)" />
        <ellipse cx="49" cy="66" rx="6" ry="10" fill="#fff" opacity="0.2" transform="rotate(-20 49 66)" />
      </g>
    </symbol>

    <!-- Mandarino (Citrus reticulata) — bottom-right corner (mirror of the pomelo scroll) -->
    <symbol id="citrus-mandarino" viewBox="0 0 120 120">
      <path d="M114,100 C112,114 90,124 68,116 C46,108 38,86 50,70 C60,56 80,54 88,66 C94,75 90,86 80,88 C73,90 67,85 70,79"
            fill="none" stroke="var(--ink)" stroke-opacity="0.15" stroke-width="7" stroke-linecap="round" transform="translate(-1,1.5)" />
      <path d="M114,100 C112,114 90,124 68,116 C46,108 38,86 50,70 C60,56 80,54 88,66 C94,75 90,86 80,88 C73,90 67,85 70,79"
            fill="none" stroke="var(--gold)" stroke-width="6" stroke-linecap="round" />
      <path d="M114,100 C112,114 90,124 68,116 C46,108 38,86 50,70 C60,56 80,54 88,66 C94,75 90,86 80,88 C73,90 67,85 70,79"
            fill="none" stroke="#e8cf94" stroke-width="2" stroke-linecap="round" />
      <use href="#leaf-glyph" x="96" y="88" width="18" height="18" fill="var(--gold)" transform="rotate(-150 105 97)" />
      <g>
        <circle cx="46" cy="84" r="12" fill="#bf7238" />
        <ellipse cx="63" cy="74" rx="19" ry="17" fill="#d98a4a" />
        <use href="#leaf-glyph" x="54" y="48" width="16" height="16" fill="#7f9468" transform="rotate(10 62 56)" />
        <use href="#leaf-glyph" x="66" y="49" width="14" height="14" fill="#7f9468" transform="rotate(45 73 56)" />
        <ellipse cx="57" cy="66" rx="5" ry="8" fill="#fff" opacity="0.22" transform="rotate(-15 57 66)" />
        <circle cx="60" cy="70" r="0.9" fill="#a1602c" opacity="0.5" />
        <circle cx="68" cy="76" r="0.9" fill="#a1602c" opacity="0.5" />
        <circle cx="58" cy="80" r="0.9" fill="#a1602c" opacity="0.5" />
        <circle cx="66" cy="84" r="0.9" fill="#a1602c" opacity="0.5" />
      </g>
    </symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="lang-toggle" role="group" aria-label="Lingua del sito / Limba site-ului">
    <button type="button" data-lang-btn="it" aria-pressed="true">IT</button>
    <span class="lang-toggle__sep">/</span>
    <button type="button" data-lang-btn="ro" aria-pressed="false">RO</button>
  </div>
  <a class="topbar__cta" href="#rsvp" data-i18n="navRsvp">RSVP</a>
</header>

<main>

  <section class="hero" id="top">
    <canvas id="leavesCanvas" class="hero__leaves" aria-hidden="true"></canvas>
    <div class="hero__inner">
      <img class="hero__crest" src="assets/Stemma_MD.jpeg" alt="Stemma M &amp; D" width="140" height="140" />
      <p class="eyebrow" data-i18n="heroEyebrow">Ci sposiamo</p>
      <h1 class="hero__names">
        <span>Matteo</span>
        <span class="hero__amp" aria-hidden="true">&amp;</span>
        <span>Anca&nbsp;Daniela</span>
      </h1>
      <p class="hero__date" id="heroDate"></p>
      <p class="hero__subtitle" data-i18n="heroSubtitle"></p>
      <a class="btn btn--primary" href="#rsvp" data-i18n="heroCta"></a>
    </div>
    <p class="hero__scroll" data-i18n="heroScroll"></p>
  </section>

  <div class="divider" aria-hidden="true"><svg class="divider__leaf"><use href="#leaf-glyph"/></svg></div>

  <section class="story" id="story">
    <div class="section-inner">
      <p class="eyebrow" data-i18n="storyEyebrow"></p>
      <h2 data-i18n="storyTitle"></h2>
      <p class="story__text" data-i18n="storyText"></p>

      <div class="story-frame" id="storyFrame">
        <svg class="story-frame__corner story-frame__corner--tl" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#citrus-corner" /></svg>
        <svg class="story-frame__corner story-frame__corner--tr" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#citrus-corner" /></svg>
        <svg class="story-frame__citrus story-frame__citrus--cedro" viewBox="0 0 150 130" aria-hidden="true" focusable="false"><use href="#citrus-cedro" /></svg>
        <svg class="story-frame__citrus story-frame__citrus--pomelo" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><use href="#citrus-pomelo" /></svg>
        <svg class="story-frame__citrus story-frame__citrus--mandarino" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><use href="#citrus-mandarino" /></svg>

        <div class="story-slider" id="storySlider">
          <div class="story-slider__viewport">
            <img class="story-slider__img is-active" src="assets/slider-web/slide-01.jpg" alt="Matteo e Anca Daniela — foto 1" loading="eager" decoding="async" />
            <img class="story-slider__img" src="assets/slider-web/slide-02.jpg" alt="Matteo e Anca Daniela — foto 2" loading="lazy" decoding="async" />
            <img class="story-slider__img" src="assets/slider-web/slide-03.jpg" alt="Matteo e Anca Daniela — foto 3" loading="lazy" decoding="async" />
            <img class="story-slider__img" src="assets/slider-web/slide-04.jpg" alt="Matteo e Anca Daniela — foto 4" loading="lazy" decoding="async" />
            <img class="story-slider__img" src="assets/slider-web/slide-05.jpg" alt="Matteo e Anca Daniela — foto 5" loading="lazy" decoding="async" />
            <img class="story-slider__img" src="assets/slider-web/slide-06.jpg" alt="Matteo e Anca Daniela — foto 6" loading="lazy" decoding="async" />
            <img class="story-slider__img" src="assets/slider-web/slide-07.jpg" alt="Matteo e Anca Daniela — foto 7" loading="lazy" decoding="async" />
            <img class="story-slider__img" src="assets/slider-web/slide-08.jpg" alt="Matteo e Anca Daniela — foto 8" loading="lazy" decoding="async" />
            <img class="story-slider__img" src="assets/slider-web/slide-09.jpg" alt="Matteo e Anca Daniela — foto 9" loading="lazy" decoding="async" />
            <img class="story-slider__img" src="assets/slider-web/slide-10.jpg" alt="Matteo e Anca Daniela — foto 10" loading="lazy" decoding="async" />
            <img class="story-slider__img" src="assets/slider-web/slide-11.jpg" alt="Matteo e Anca Daniela — foto 11" loading="lazy" decoding="async" />
            <button type="button" class="story-slider__nav story-slider__nav--prev" aria-label="Foto precedente">&#10094;</button>
            <button type="button" class="story-slider__nav story-slider__nav--next" aria-label="Foto successiva">&#10095;</button>
          </div>
          <div class="story-slider__dots" role="tablist" aria-label="Seleziona foto"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="divider" aria-hidden="true"><svg class="divider__leaf"><use href="#leaf-glyph"/></svg></div>

  <section class="details" id="details">
    <div class="section-inner">
      <p class="eyebrow" data-i18n="detailsEyebrow"></p>
      <h2 data-i18n="detailsTitle"></h2>
      <div class="details__grid">
        <article class="detail-card">
          <h3 data-i18n="ceremonyLabel"></h3>
          <p class="detail-card__time" id="ceremonyTime"></p>
          <p class="detail-card__venue" id="ceremonyVenue"></p>
          <p class="detail-card__address" id="ceremonyAddress"></p>
        </article>
        <article class="detail-card">
          <h3 data-i18n="receptionLabel"></h3>
          <p class="detail-card__time" id="receptionTime"></p>
          <p class="detail-card__venue" id="receptionVenue"></p>
          <p class="detail-card__address" id="receptionAddress"></p>
        </article>
      </div>
      <p class="details__dresscode"><span data-i18n="dressCodeLabel"></span> — <strong data-i18n="dressCodeValue"></strong></p>
      <p class="details__note" data-i18n="detailsNote"></p>
    </div>
  </section>

  <section class="countdown" id="countdown">
    <div class="section-inner">
      <p class="eyebrow eyebrow--light" data-i18n="countdownEyebrow"></p>
      <h2 data-i18n="countdownTitle"></h2>
      <div class="countdown__grid" id="countdownGrid">
        <div class="countdown__cell"><span id="cdDays">00</span><small data-i18n="days"></small></div>
        <div class="countdown__cell"><span id="cdHours">00</span><small data-i18n="hours"></small></div>
        <div class="countdown__cell"><span id="cdMinutes">00</span><small data-i18n="minutes"></small></div>
        <div class="countdown__cell"><span id="cdSeconds">00</span><small data-i18n="seconds"></small></div>
      </div>
      <p class="countdown__done" id="countdownDone" style="display:none"></p>
    </div>
  </section>

  <div class="divider" aria-hidden="true"><svg class="divider__leaf"><use href="#leaf-glyph"/></svg></div>

  <section class="rsvp" id="rsvp">
    <div class="section-inner">
      <p class="eyebrow" data-i18n="rsvpEyebrow"></p>
      <h2 data-i18n="rsvpTitle"></h2>
      <p class="rsvp__intro"><span data-i18n="rsvpIntro"></span> <strong id="rsvpDeadline"></strong></p>

      <form id="rsvpForm" class="rsvp-form" autocomplete="off">
        <div class="field">
          <label for="fullName" data-i18n="labelFullName"></label>
          <input type="text" id="fullName" name="fullName" data-i18n-ph="placeholderFullName" required />
        </div>

        <fieldset class="field field--choice">
          <legend data-i18n="labelAttending"></legend>
          <label class="choice"><input type="radio" name="attending" value="si" /> <span data-i18n="attendingYes"></span></label>
          <label class="choice"><input type="radio" name="attending" value="no" /> <span data-i18n="attendingNo"></span></label>
        </fieldset>

        <div class="attending-extra" id="attendingExtraFields">
          <fieldset class="field field--choice">
            <legend data-i18n="labelPlusOne"></legend>
            <label class="choice"><input type="radio" name="plusOne" value="si" /> <span data-i18n="yesShort"></span></label>
            <label class="choice"><input type="radio" name="plusOne" value="no" /> <span data-i18n="noShort"></span></label>
          </fieldset>
          <div class="field" id="plusOneNameField">
            <label for="plusOneName" data-i18n="labelPlusOneName"></label>
            <input type="text" id="plusOneName" name="plusOneName" data-i18n-ph="placeholderPlusOneName" />
          </div>

          <fieldset class="field field--choice">
            <legend data-i18n="labelChildren"></legend>
            <label class="choice"><input type="radio" name="children" value="si" /> <span data-i18n="yesShort"></span></label>
            <label class="choice"><input type="radio" name="children" value="no" /> <span data-i18n="noShort"></span></label>
          </fieldset>
          <div class="children-detail" id="childrenDetailFields">
            <div class="field">
              <label for="childrenCount" data-i18n="labelChildrenCount"></label>
              <input type="number" id="childrenCount" name="childrenCount" min="1" max="10" />
            </div>
            <div class="field">
              <label for="childrenNames" data-i18n="labelChildrenNames"></label>
              <input type="text" id="childrenNames" name="childrenNames" data-i18n-ph="placeholderChildrenNames" />
            </div>
          </div>

          <div class="field">
            <label for="dietary" data-i18n="labelDietary"></label>
            <input type="text" id="dietary" name="dietary" data-i18n-ph="placeholderDietary" />
          </div>
        </div>

        <div class="field">
          <label for="message" data-i18n="labelMessage"></label>
          <textarea id="message" name="message" rows="4" data-i18n-ph="placeholderMessage"></textarea>
        </div>

        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_template" value="table" />
        <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" />

        <button type="submit" id="rsvpSubmit" class="btn btn--primary btn--block" data-i18n="submitButton"></button>
      </form>
      <div id="rsvpStatus" class="rsvp-status" hidden></div>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="section-inner">
      <p class="eyebrow" data-i18n="contactEyebrow"></p>
      <p data-i18n="contactText"></p>
      <a id="contactEmailLink" class="contact__email" href="#"></a>
    </div>
  </section>

</main>

<footer class="site-footer">
  <svg class="site-footer__leaf" aria-hidden="true"><use href="#leaf-glyph"/></svg>
  <p data-i18n="footerThanks"></p>
  <p class="site-footer__names">Matteo &amp; Anca Daniela</p>
  <p class="site-footer__hashtag" data-i18n="footerHashtag"></p>
  <p class="site-footer__year">&copy; <span id="year"></span></p>
</footer>

<script src="script.js"></script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Matteo &amp; Anca Daniela — Il nostro matrimonio</title>
<meta name="description" content="Matteo e Anca Daniela si sposano — conferma qui la tua presenza." />
<link rel="icon" type="image/png" href="assets/Stemma.png" />
<link rel="stylesheet" href="assets/fonts-embed.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="leaf-glyph" viewBox="0 0 32 32">
      <path d="M16 3c8.5 5.5 12.5 13 8.8 20.6C22 29 14.6 30.5 11 26.6 5.7 21 6.2 12 16 3z" />
      <path d="M16 7v19" stroke-width="1.3" stroke-linecap="round" fill="none" />
    </symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="lang-toggle" role="group" aria-label="Lingua del sito / Limba site-ului">
    <button type="button" data-lang-btn="it" aria-pressed="true">IT</button>
    <span class="lang-toggle__sep">/</span>
    <button type="button" data-lang-btn="ro" aria-pressed="false">RO</button>
  </div>
  <a class="topbar__cta" href="#rsvp" data-i18n="navRsvp">RSVP</a>
</header>

<main>

  <section class="hero" id="top">
    <canvas id="leavesCanvas" class="hero__leaves" aria-hidden="true"></canvas>
    <div class="hero__inner">
      <img class="hero__crest" src="assets/Stemma.png" alt="Stemma M &amp; D" width="140" height="140" />
      <p class="eyebrow" data-i18n="heroEyebrow">Ci sposiamo</p>
      <h1 class="hero__names">
        <span>Matteo</span>
        <span class="hero__amp" aria-hidden="true">&amp;</span>
        <span>Anca&nbsp;Daniela</span>
      </h1>
      <p class="hero__date" id="heroDate"></p>
      <p class="hero__subtitle" data-i18n="heroSubtitle"></p>
      <a class="btn btn--primary" href="#rsvp" data-i18n="heroCta"></a>
    </div>
    <p class="hero__scroll" data-i18n="heroScroll"></p>
  </section>

  <div class="divider" aria-hidden="true"><svg class="divider__leaf"><use href="#leaf-glyph"/></svg></div>

  <section class="story" id="story">
    <div class="section-inner">
      <p class="eyebrow" data-i18n="storyEyebrow"></p>
      <h2 data-i18n="storyTitle"></h2>
      <p class="story__text" data-i18n="storyText"></p>
    </div>
  </section>

  <div class="divider" aria-hidden="true"><svg class="divider__leaf"><use href="#leaf-glyph"/></svg></div>

  <section class="details" id="details">
    <div class="section-inner">
      <p class="eyebrow" data-i18n="detailsEyebrow"></p>
      <h2 data-i18n="detailsTitle"></h2>
      <div class="details__grid">
        <article class="detail-card">
          <h3 data-i18n="ceremonyLabel"></h3>
          <p class="detail-card__time" id="ceremonyTime"></p>
          <p class="detail-card__venue" id="ceremonyVenue"></p>
          <p class="detail-card__address" id="ceremonyAddress"></p>
        </article>
        <article class="detail-card">
          <h3 data-i18n="receptionLabel"></h3>
          <p class="detail-card__time" id="receptionTime"></p>
          <p class="detail-card__venue" id="receptionVenue"></p>
          <p class="detail-card__address" id="receptionAddress"></p>
        </article>
      </div>
      <p class="details__dresscode"><span data-i18n="dressCodeLabel"></span> — <strong data-i18n="dressCodeValue"></strong></p>
      <p class="details__note" data-i18n="detailsNote"></p>
    </div>
  </section>

  <section class="countdown" id="countdown">
    <div class="section-inner">
      <p class="eyebrow eyebrow--light" data-i18n="countdownEyebrow"></p>
      <h2 data-i18n="countdownTitle"></h2>
      <div class="countdown__grid" id="countdownGrid">
        <div class="countdown__cell"><span id="cdDays">00</span><small data-i18n="days"></small></div>
        <div class="countdown__cell"><span id="cdHours">00</span><small data-i18n="hours"></small></div>
        <div class="countdown__cell"><span id="cdMinutes">00</span><small data-i18n="minutes"></small></div>
        <div class="countdown__cell"><span id="cdSeconds">00</span><small data-i18n="seconds"></small></div>
      </div>
      <p class="countdown__done" id="countdownDone" style="display:none"></p>
    </div>
  </section>

  <div class="divider" aria-hidden="true"><svg class="divider__leaf"><use href="#leaf-glyph"/></svg></div>

  <section class="rsvp" id="rsvp">
    <div class="section-inner">
      <p class="eyebrow" data-i18n="rsvpEyebrow"></p>
      <h2 data-i18n="rsvpTitle"></h2>
      <p class="rsvp__intro"><span data-i18n="rsvpIntro"></span> <strong id="rsvpDeadline"></strong></p>

      <form id="rsvpForm" class="rsvp-form" autocomplete="off">
        <div class="field">
          <label for="fullName" data-i18n="labelFullName"></label>
          <input type="text" id="fullName" name="fullName" data-i18n-ph="placeholderFullName" required />
        </div>

        <fieldset class="field field--choice">
          <legend data-i18n="labelAttending"></legend>
          <label class="choice"><input type="radio" name="attending" value="si" /> <span data-i18n="attendingYes"></span></label>
          <label class="choice"><input type="radio" name="attending" value="no" /> <span data-i18n="attendingNo"></span></label>
        </fieldset>

        <div class="attending-extra" id="attendingExtraFields">
          <fieldset class="field field--choice">
            <legend data-i18n="labelPlusOne"></legend>
            <label class="choice"><input type="radio" name="plusOne" value="si" /> <span data-i18n="yesShort"></span></label>
            <label class="choice"><input type="radio" name="plusOne" value="no" /> <span data-i18n="noShort"></span></label>
          </fieldset>
          <div class="field" id="plusOneNameField">
            <label for="plusOneName" data-i18n="labelPlusOneName"></label>
            <input type="text" id="plusOneName" name="plusOneName" data-i18n-ph="placeholderPlusOneName" />
          </div>

          <fieldset class="field field--choice">
            <legend data-i18n="labelChildren"></legend>
            <label class="choice"><input type="radio" name="children" value="si" /> <span data-i18n="yesShort"></span></label>
            <label class="choice"><input type="radio" name="children" value="no" /> <span data-i18n="noShort"></span></label>
          </fieldset>
          <div class="children-detail" id="childrenDetailFields">
            <div class="field">
              <label for="childrenCount" data-i18n="labelChildrenCount"></label>
              <input type="number" id="childrenCount" name="childrenCount" min="1" max="10" />
            </div>
            <div class="field">
              <label for="childrenNames" data-i18n="labelChildrenNames"></label>
              <input type="text" id="childrenNames" name="childrenNames" data-i18n-ph="placeholderChildrenNames" />
            </div>
          </div>

          <div class="field">
            <label for="dietary" data-i18n="labelDietary"></label>
            <input type="text" id="dietary" name="dietary" data-i18n-ph="placeholderDietary" />
          </div>
        </div>

        <div class="field">
          <label for="message" data-i18n="labelMessage"></label>
          <textarea id="message" name="message" rows="4" data-i18n-ph="placeholderMessage"></textarea>
        </div>

        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_template" value="table" />
        <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" />

        <button type="submit" id="rsvpSubmit" class="btn btn--primary btn--block" data-i18n="submitButton"></button>
      </form>
      <div id="rsvpStatus" class="rsvp-status" hidden></div>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="section-inner">
      <p class="eyebrow" data-i18n="contactEyebrow"></p>
      <p data-i18n="contactText"></p>
      <a id="contactEmailLink" class="contact__email" href="#"></a>
    </div>
  </section>

</main>

<footer class="site-footer">
  <svg class="site-footer__leaf" aria-hidden="true"><use href="#leaf-glyph"/></svg>
  <p data-i18n="footerThanks"></p>
  <p class="site-footer__names">Matteo &amp; Anca Daniela</p>
  <p class="site-footer__hashtag" data-i18n="footerHashtag"></p>
  <p class="site-footer__year">&copy; <span id="year"></span></p>
</footer>

<script src="script.js"></script>
</body>
</html>

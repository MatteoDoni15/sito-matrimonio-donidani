<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matteo &amp; Daniela — Il nostro matrimonio</title>
  <meta name="description" content="Matteo e Daniela si sposano — conferma qui la tua presenza." />
  <link rel="icon" type="image/jpeg" href="assets/Stemma_MD.jpeg" />
  <link rel="stylesheet" href="assets/fonts-embed.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="envelope-intro" id="envelopeIntro">
    <button type="button" class="envelope-trigger" id="envelopeButton" aria-label="Apri l'invito e scopri il sito">
      <span id="envelope" class="close">
        <span class="front flap">
          <svg class="flap-svg" viewBox="0 0 300 210" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0,0 L300,0 L150,132 Z" fill="url(#envFlapGrad)" />
          </svg>
        </span>
        <span class="front pocket">
          <svg class="pocket-svg" viewBox="0 0 300 210" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0,0 L150,122 L300,0 L300,210 L0,210 Z" fill="url(#envPocketGrad)" />
            <path d="M0,0 L150,122 L300,0" fill="none" stroke="#2f4658" stroke-width="2" opacity="0.35" />
          </svg>
        </span>
        <img class="envelope__seal" src="assets/Stemma_MD_lettera.webp" alt="" aria-hidden="true" />
        <span class="letter">
          <span class="letter__names">Matteo <span class="letter__amp">&amp;</span> Daniela</span>
          <span class="letter__subtitle">Wedding Invitation</span>
        </span>
        <span class="hearts">
          <span class="heart" style="--l:12%; --s:0.6; --d:0.45s; --dur:1.05s;"></span>
          <span class="heart" style="--l:24%; --s:0.9; --d:0.5s; --dur:1.2s;"></span>
          <span class="heart" style="--l:36%; --s:0.5; --d:0.55s; --dur:0.95s;"></span>
          <span class="heart" style="--l:48%; --s:1.1; --d:0.6s; --dur:1.3s;"></span>
          <span class="heart" style="--l:5%; --s:0.75; --d:0.65s; --dur:1.15s;"></span>
          <span class="heart" style="--l:60%; --s:0.65; --d:0.68s; --dur:1.05s;"></span>
          <span class="heart" style="--l:72%; --s:1; --d:0.72s; --dur:1.25s;"></span>
          <span class="heart" style="--l:18%; --s:0.85; --d:0.76s; --dur:1.1s;"></span>
          <span class="heart" style="--l:84%; --s:0.55; --d:0.8s; --dur:0.9s;"></span>
          <span class="heart" style="--l:42%; --s:0.7; --d:0.84s; --dur:1.35s;"></span>
          <span class="heart" style="--l:30%; --s:1.05; --d:0.92s; --dur:1s;"></span>
          <span class="heart" style="--l:66%; --s:0.6; --d:0.96s; --dur:1.2s;"></span>
          <span class="heart" style="--l:10%; --s:0.8; --d:1s; --dur:1.1s;"></span>
        </span>
      </span>
      <span class="envelope__hint" data-i18n="envelopeHint"></span>
    </button>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="leaf-glyph" viewBox="0 0 32 32">
        <path d="M16 3c8.5 5.5 12.5 13 8.8 20.6C22 29 14.6 30.5 11 26.6 5.7 21 6.2 12 16 3z" />
        <path d="M16 7v19" stroke-width="1.3" stroke-linecap="round" fill="none" />
      </symbol>
      <symbol id="heart-empty-glyph" viewBox="0 0 48 48">
        <path
          d="m43,17.0766c0-5.6539-4.5835-10.2373-10.2374-10.2373-3.7223,0-6.9708,1.9932-8.7626,4.964-1.7919-2.9708-5.0403-4.964-8.7626-4.964-5.6539,0-10.2373,4.5834-10.2373,10.2373,0,1.2925.2496,2.524.6866,3.6627,3.3851,9.7368,18.3134,20.4215,18.3134,20.4215,0,0,14.9282-10.6847,18.3134-20.4215.437-1.1386.6867-2.3702.6867-3.6627Z" />
      </symbol>
      <linearGradient id="envFlapGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#4a6d8c" />
        <stop offset="100%" stop-color="#3a5570" />
      </linearGradient>
      <linearGradient id="envPocketGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4c6f8c" />
        <stop offset="100%" stop-color="#3d5b73" />
      </linearGradient>
    </defs>
  </svg>

  <header class="topbar">
    <div class="lang-toggle" role="group" aria-label="Lingua del sito / Limba site-ului">
      <button type="button" data-lang-btn="it" aria-pressed="true">IT</button>
      <span class="lang-toggle__sep">/</span>
      <button type="button" data-lang-btn="ro" aria-pressed="false">RO</button>
    </div>
    <a class="topbar__cta" href="#rsvp" data-i18n="navRsvp">RSVP</a>
  </header>

  <main>

    <section class="hero" id="top">
      <canvas id="leavesCanvas" class="hero__leaves" aria-hidden="true"></canvas>
      <div class="hero__valzer" aria-hidden="true">
        <img class="hero__valzer-frame is-active" src="assets/Valzer/Donidani_valzer_1.webp" alt="" loading="eager"
          decoding="async" />
        <img class="hero__valzer-frame" src="assets/Valzer/Donidani_valzer_2.webp" alt="" loading="eager"
          decoding="async" />
        <img class="hero__valzer-frame" src="assets/Valzer/Donidani_valzer_3.webp" alt="" loading="eager"
          decoding="async" />
        <img class="hero__valzer-frame" src="assets/Valzer/Donidani_valzer_4.webp" alt="" loading="eager"
          decoding="async" />
        <img class="hero__valzer-frame" src="assets/Valzer/Donidani_valzer_5.webp" alt="" loading="eager"
          decoding="async" />
        <img class="hero__valzer-frame" src="assets/Valzer/Donidani_valzer_6.webp" alt="" loading="eager"
          decoding="async" />
        <img class="hero__valzer-frame" src="assets/Valzer/Donidani_valzer_7.webp" alt="" loading="eager"
          decoding="async" />
      </div>
      <div class="hero__inner">
        <img class="hero__crest" src="assets/Stemma_MD.jpeg" alt="Stemma M &amp; D" width="140" height="140" />
        <p class="eyebrow" data-i18n="heroEyebrow">Ci sposiamo</p>
        <h1 class="hero__names">
          <span>Matteo</span>
          <span class="hero__amp" aria-hidden="true">&amp;</span>
          <span>&nbsp;Daniela</span>
        </h1>
        <p class="hero__date" id="heroDate"></p>
        <p class="hero__subtitle" data-i18n="heroSubtitle"></p>
        <a class="btn btn--primary" href="#rsvp" data-i18n="heroCta"></a>
      </div>
      <p class="hero__scroll" data-i18n="heroScroll"></p>
    </section>

    <div class="divider" aria-hidden="true"><svg class="divider__leaf">
        <use href="#heart-empty-glyph" />
      </svg></div>

    <section class="story" id="story">

    <div class="divider" aria-hidden="true"><svg class="divider__leaf">
        <use href="#heart-empty-glyph" />
      </svg></div>

    <section class="details" id="details">
      <img class="details__decor" src="assets/Donidani_side_left.webp" alt="" aria-hidden="true" loading="lazy"
        decoding="async" />
      <div class="section-inner">
        <p class="eyebrow" data-i18n="detailsEyebrow"></p>
        <h2 data-i18n="detailsTitle"></h2>
        <div class="details__grid">
          <article class="detail-card">
            <h3 data-i18n="ceremonyLabel"></h3>
            <p class="detail-card__time" id="ceremonyTime"></p>
            <p class="detail-card__venue" id="ceremonyVenue"></p>
            <p class="detail-card__address" id="ceremonyAddress"></p>
            <a class="detail-card__map" id="ceremonyMapLink" href="#" target="_blank" rel="noopener"
              data-i18n="directionsLabel" hidden></a>
          </article>
          <article class="detail-card">
            <h3 data-i18n="receptionLabel"></h3>
            <p class="detail-card__time" id="receptionTime"></p>
            <p class="detail-card__venue" id="receptionVenue"></p>
            <p class="detail-card__address" id="receptionAddress"></p>
            <a class="detail-card__map" id="receptionMapLink" href="#" target="_blank" rel="noopener"
              data-i18n="directionsLabel" hidden></a>
          </article>
        </div>
        <p class="details__dresscode"><span data-i18n="dressCodeLabel"></span> — <strong
            data-i18n="dressCodeValue"></strong></p>
        <p class="details__note" data-i18n="detailsNote"></p>
      </div>
    </section>

    <div class="divider" aria-hidden="true"><svg class="divider__leaf">
        <use href="#heart-empty-glyph" />
      </svg></div>

    <section class="venue-scene" id="venueScene">
      <div class="section-inner">
        <p class="eyebrow" data-i18n="venueEyebrow"></p>
        <h2 data-i18n="venueTitle"></h2>
        <p class="venue-scene__text" data-i18n="venueText"></p>
      </div>
      <div class="venue-scene__frame" id="venueFrame">
        <div class="venue-scene__image">
          <img class="venue-scene__photo venue-scene__photo--day" src="assets/location-giorno.webp"
            alt="La location del ricevimento, di giorno" loading="lazy" decoding="async" />
          <img class="venue-scene__photo venue-scene__photo--night" src="assets/location-notte.webp"
            alt="La location del ricevimento, di notte" loading="lazy" decoding="async" />
        </div>
        <button type="button" class="venue-scene__toggle" id="venueToggle" aria-pressed="false"
          data-i18n-aria-label="venueToggleLabel">
          <span class="venue-scene__toggle-icon venue-scene__toggle-icon--sun" aria-hidden="true">☀</span>
          <span class="venue-scene__toggle-track"><span class="venue-scene__toggle-thumb"></span></span>
          <span class="venue-scene__toggle-icon venue-scene__toggle-icon--moon" aria-hidden="true">☾</span>
        </button>
      </div>
    </section>

    <div class="divider" aria-hidden="true"><svg class="divider__leaf">
        <use href="#heart-empty-glyph" />
      </svg></div>

    <section class="countdown" id="countdown">
      <img class="countdown__decor" src="assets/Donidani_clock.webp" alt="" aria-hidden="true" loading="lazy"
        decoding="async" />
      <div class="section-inner">
        <p class="eyebrow eyebrow--light" data-i18n="countdownEyebrow"></p>
        <h2 data-i18n="countdownTitle"></h2>
        <div class="countdown__grid" id="countdownGrid">
          <div class="countdown__cell"><span id="cdDays">00</span><small data-i18n="days"></small></div>
          <div class="countdown__cell"><span id="cdHours">00</span><small data-i18n="hours"></small></div>
          <div class="countdown__cell"><span id="cdMinutes">00</span><small data-i18n="minutes"></small></div>
          <div class="countdown__cell"><span id="cdSeconds">00</span><small data-i18n="seconds"></small></div>
        </div>
        <p class="countdown__done" id="countdownDone" style="display:none"></p>
      </div>
    </section>

    <div class="divider" aria-hidden="true"><svg class="divider__leaf">
        <use href="#heart-empty-glyph" />
      </svg></div>

    <section class="rsvp" id="rsvp">
      <img class="rsvp__decor" src="assets/Donidani_conferma.webp" alt="" aria-hidden="true" loading="lazy"
        decoding="async" />
      <div class="section-inner">
        <p class="eyebrow" data-i18n="rsvpEyebrow"></p>
        <h2 data-i18n="rsvpTitle"></h2>
        <p class="rsvp__intro"><span data-i18n="rsvpIntro"></span> <strong id="rsvpDeadline"></strong></p>

        <form id="rsvpForm" class="rsvp-form" autocomplete="off">
          <div class="field">
            <label for="fullName" data-i18n="labelFullName"></label>
            <input type="text" id="fullName" name="fullName" data-i18n-ph="placeholderFullName" required />
          </div>

          <fieldset class="field field--choice">
            <legend data-i18n="labelAttending"></legend>
            <label class="choice"><input type="radio" name="attending" value="si" /> <span
                data-i18n="attendingYes"></span></label>
            <label class="choice"><input type="radio" name="attending" value="no" /> <span
                data-i18n="attendingNo"></span></label>
          </fieldset>

          <div class="attending-extra" id="attendingExtraFields">
            <fieldset class="field field--choice">
              <legend data-i18n="labelPlusOne"></legend>
              <label class="choice"><input type="radio" name="plusOne" value="si" /> <span
                  data-i18n="yesShort"></span></label>
              <label class="choice"><input type="radio" name="plusOne" value="no" /> <span
                  data-i18n="noShort"></span></label>
            </fieldset>
            <div class="field" id="plusOneNameField">
              <label for="plusOneName" data-i18n="labelPlusOneName"></label>
              <input type="text" id="plusOneName" name="plusOneName" data-i18n-ph="placeholderPlusOneName" />
            </div>

            <fieldset class="field field--choice">
              <legend data-i18n="labelChildren"></legend>
              <label class="choice"><input type="radio" name="children" value="si" /> <span
                  data-i18n="yesShort"></span></label>
              <label class="choice"><input type="radio" name="children" value="no" /> <span
                  data-i18n="noShort"></span></label>
            </fieldset>
            <div class="children-detail" id="childrenDetailFields">
              <div class="field">
                <label for="childrenCount" data-i18n="labelChildrenCount"></label>
                <input type="number" id="childrenCount" name="childrenCount" min="1" max="10" />
              </div>
              <div class="field">
                <label for="childrenNames" data-i18n="labelChildrenNames"></label>
                <input type="text" id="childrenNames" name="childrenNames" data-i18n-ph="placeholderChildrenNames" />
              </div>
            </div>

            <div class="field">
              <label for="dietary" data-i18n="labelDietary"></label>
              <input type="text" id="dietary" name="dietary" data-i18n-ph="placeholderDietary" />
            </div>
          </div>

          <div class="field">
            <label for="message" data-i18n="labelMessage"></label>
            <textarea id="message" name="message" rows="4" data-i18n-ph="placeholderMessage"></textarea>
          </div>

          <input type="hidden" name="_captcha" value="false" />
          <input type="hidden" name="_template" value="table" />
          <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" />

          <button type="submit" id="rsvpSubmit" class="btn btn--primary btn--block" data-i18n="submitButton"></button>
        </form>
        <div id="rsvpStatus" class="rsvp-status" hidden></div>

        <details class="rsvp-gift">
          <summary>
            <span data-i18n="giftToggle"></span>
            <span class="rsvp-gift__toggle-icon" aria-hidden="true"></span>
          </summary>
          <div class="rsvp-gift__body">
            <p class="rsvp-gift__intro" data-i18n="giftIntro"></p>
            <dl class="rsvp-gift__details">
              <div class="rsvp-gift__row">
                <dt data-i18n="giftBeneficiaryLabel"></dt>
                <dd>Matteo Doni &amp; Anca Daniela Popoiu</dd>
              </div>
              <div class="rsvp-gift__row">
                <dt data-i18n="giftIbanLabel"></dt>
                <dd class="rsvp-gift__iban">
                  <span id="giftIbanValue">IT42 R036 6901 6000 6678 9352 439</span>
                  <button type="button" class="rsvp-gift__copy" id="giftCopyBtn" data-i18n="giftCopy"></button>
                </dd>
              </div>
              <div class="rsvp-gift__row">
                <dt data-i18n="giftBicLabel"></dt>
                <dd>REVOITM2</dd>
              </div>
              <div class="rsvp-gift__row">
                <dt data-i18n="giftBankLabel"></dt>
                <dd>Revolut Bank UAB — Via Dante 7, 20123 Milano (MI)</dd>
              </div>
            </dl>
          </div>
        </details>
      </div>
    </section>

    <section class="photos" id="photos">
      <img class="photos__decor" src="assets/Donidani_picture.webp" alt="" aria-hidden="true" loading="lazy"
        decoding="async" />
      <div class="section-inner">
        <p class="eyebrow" data-i18n="photosEyebrow"></p>
        <h2 data-i18n="photosTitle"></h2>
        <p class="photos__text" data-i18n="photosText"></p>
        <div class="photos__card">
          <img class="photos__qr" src="assets/qr/foto-matrimonio-qr.png" width="200" height="200"
            data-i18n-alt="photosQrAlt" alt="" />
          <div class="photos__actions">
            <a class="btn btn--primary" id="photosLink" href="#" target="_blank" rel="noopener"
              data-i18n="photosUploadCta"></a>
            <a class="btn btn--secondary" id="photosGalleryLink" href="gallery.html" data-i18n="photosViewCta"></a>
          </div>
        </div>
      </div>
    </section>

    <div class="divider" aria-hidden="true"><svg class="divider__leaf">
        <use href="#heart-empty-glyph" />
      </svg></div>

    <section class="contact" id="contact">
      <div class="section-inner">
        <p class="eyebrow" data-i18n="contactEyebrow"></p>
        <p data-i18n="contactText"></p>
        <a id="contactEmailLink" class="contact__email" href="#"></a>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <svg class="site-footer__leaf" aria-hidden="true">
      <use href="#heart-empty-glyph" />
    </svg>
    <p data-i18n="footerThanks"></p>
    <p class="site-footer__names">Matteo &amp; Daniela</p>
    <p class="site-footer__hashtag" data-i18n="footerHashtag"></p>
